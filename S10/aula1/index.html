<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/styles/index.styles.css">
    <title>página BikCraft</title>
</head>
<body>
    <header class="cabecalho">
    </header>
    <section>
        <a href="#">Bicicletas</a>
        <a href="#">Seguros</a>
        <a href="#">Contatos</a>
    </section>
    <main>
        <form action="#" method="post">
            <div>
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" placeholder="seu nome">
            </div>
            <div>
                <label for="telefone">Telefone</label>
                <input type="tel" id="telefone" name="telefone" placeholder="(DDD) 99999-9999">
            </div>
            <div>
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="contato@email.com">
            </div>
            <div>
                <label for="mensagem">Mensagem</label>
                <textarea id="mensagem" name="mensagem" rows="5" placeholder="o que você precisa?">
            </div>
        </form>

    </main>

    <script src="assets/scripts/main.js"></script>
</body>
</html>
